[workspace]
resolver = "3"
members = [
    "crates/kernel",
    "crates/domain/hydraulics",
    "crates/domain/detection",
    "crates/domain/localisation",
    "crates/interfaces/cli",
    "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "LicenseRef-Proprietary"
repository = "https://github.com/MandlaBaloyi/joukowsky"

[workspace.dependencies]
jk-kernel = { path = "crates/kernel" }
jk-hydraulics = { path = "crates/domain/hydraulics" }
jk-detection = { path = "crates/domain/detection" }
jk-localisation = { path = "crates/domain/localisation" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Physics code names quantities h, q, a, b the way the equations do.
many_single_char_names = "allow"
similar_names = "allow"
