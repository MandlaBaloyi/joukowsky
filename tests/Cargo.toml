[package]
name = "jk-tests"
description = "Validation tests for the joukowsky engine, grouped by bounded context"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
autotests = false

# Shared helpers used by every test program.
[lib]
name = "jk_tests"
path = "common/lib.rs"

# ONE test program per bounded context. Each is compiled and linked
# separately, and linking is the slow part - so topics are folders
# (modules) inside a context's program, never programs of their own.
# Run one with:  .\tests\run-tests.ps1 -Only hydraulics
[[test]]
name = "kernel"
path = "kernel/main.rs"

[[test]]
name = "hydraulics"
path = "hydraulics/main.rs"

[[test]]
name = "detection"
path = "detection/main.rs"

[[test]]
name = "localisation"
path = "localisation/main.rs"

[[test]]
name = "classification"
path = "classification/main.rs"

[[test]]
name = "pipeline"
path = "pipeline/main.rs"

[[test]]
name = "adapters"
path = "adapters/main.rs"

[[test]]
name = "balance"
path = "balance/main.rs"

[dependencies]
jk-kernel.workspace = true
jk-hydraulics.workspace = true
jk-detection.workspace = true
jk-localisation.workspace = true
jk-classification.workspace = true
jk-application.workspace = true
jk-files.workspace = true
jk-sim.workspace = true
jk-balance.workspace = true

[lints]
workspace = true
